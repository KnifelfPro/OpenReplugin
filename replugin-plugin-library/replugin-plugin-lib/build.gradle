plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

android {
    namespace 'com.qihoo360.replugin.library'
    compileSdk 37

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 37

        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'replugin-library-rules.pro'

        buildConfigField "int", 'VERSION_CODE', String.valueOf(1)
        buildConfigField 'String', 'VERSION_NAME', "\"" + "1.0" + "\""
    }

    buildTypes {
        release {
            // Plugins subclass PluginActivity; R8 would mark lifecycle methods final.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'com.android.support:appcompat-v7:28.0.0'
    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    compileOnly 'androidx.activity:activity:1.13.0'
}

project.ext.RP_ARTIFACT_ID = 'replugin-plugin-lib'
apply from: '../../rp-publish.gradle'