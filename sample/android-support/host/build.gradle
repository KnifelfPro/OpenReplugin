plugins {
    id 'com.android.application'
    id 'io.github.knifelfpro.replugin-host-gradle'
}

android {
    namespace 'club.knifelf.support.host'
    compileSdk 37
    defaultConfig {
        applicationId "club.knifelf.support.host"
        minSdkVersion 19
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

repluginHostConfig {
    useAppCompat = true
    useAndroidX = false
}

dependencies {
    implementation 'io.github.knifelfpro:replugin-host-lib:3.2.0'
    // AGP 9: animated-vector-drawable and support-vector-drawable share one namespace.
    implementation('com.android.support:appcompat-v7:28.0.0') {
        exclude group: 'com.android.support', module: 'animated-vector-drawable'
    }
    implementation 'com.android.support:multidex:1.0.3'
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn ':plugin:copyPluginToHost'
    }
}
