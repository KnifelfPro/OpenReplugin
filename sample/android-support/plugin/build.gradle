plugins {
    id 'com.android.application'
    id 'io.github.knifelfpro.replugin-plugin-gradle'
}

android {
    namespace 'club.knifelf.support.plugin'
    compileSdk 37
    defaultConfig {
        applicationId "club.knifelf.support.plugin"
        minSdkVersion 19
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

repluginPluginConfig {
    pluginName = "support"
    hostApplicationId = "club.knifelf.support.host"
    hostAppLauncherActivity = "club.knifelf.support.host.MainActivity"
}

dependencies {
    implementation 'io.github.knifelfpro:replugin-plugin-lib:3.3.0'
    // AGP 9: animated-vector-drawable and support-vector-drawable share one namespace.
    implementation('com.android.support:appcompat-v7:28.0.0') {
        exclude group: 'com.android.support', module: 'animated-vector-drawable'
    }
}

tasks.register('copyPluginToHost') {
    group = 'sample'
    description = 'Copy plugin debug APK into host assets/plugins as support.jar'
    dependsOn 'assembleDebug'
    doLast {
        def apk = fileTree(layout.buildDirectory.dir('outputs/apk/debug')).matching {
            include '*.apk'
            exclude '*unaligned*', '*unsigned*'
        }.files.find { it.name.endsWith('.apk') }
        if (apk == null || !apk.exists()) {
            throw new GradleException('plugin debug apk not found')
        }
        def destDir = file("${rootProject.projectDir}/host/src/main/assets/plugins")
        destDir.mkdirs()
        def dest = new File(destDir, 'support.jar')
        dest.bytes = apk.bytes
        println ">>> copied ${apk} -> ${dest}"
    }
}
