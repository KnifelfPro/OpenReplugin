plugins {
    id 'com.android.application'
    id 'io.github.knifelfpro.replugin-host-gradle'
}

android {
    namespace 'club.knifelf.fresco.host'
    compileSdk 37
    defaultConfig {
        applicationId "club.knifelf.fresco.host"
        minSdkVersion 21
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

repluginHostConfig {
    useAppCompat = true
    useAndroidX = true
}

dependencies {
    implementation 'io.github.knifelfpro:replugin-host-lib:3.2.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn ':plugin:copyPluginToHost'
    }
}
