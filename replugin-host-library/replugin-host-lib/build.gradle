/**
 * @author RePlugin Team
 */
plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

android {
    namespace 'com.qihoo360.mobilesafe.core'
    compileSdk 37

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 37

        versionCode 2
        versionName version
        consumerProguardFiles 'replugin-rules.pro'

        buildConfigField "int", 'VERSION_CODE', String.valueOf(2)
        buildConfigField 'String', 'VERSION_NAME', "\"" + version + "\""
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}

project.ext.RP_ARTIFACT_ID = 'replugin-host-lib'
apply from: '../../rp-publish.gradle'
