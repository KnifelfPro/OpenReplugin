plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

repositories {
    google()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    compileOnly 'com.android.tools.build:gradle:9.2.0'
    implementation 'net.dongliu:apk-parser:2.6.10'
    implementation 'org.apache.groovy:groovy-xml:4.0.29'

    implementation gradleApi()
    implementation localGroovy()
}

gradlePlugin {
    plugins {
        hostGradle {
            id = 'replugin-host-gradle'
            implementationClass = 'com.qihoo360.replugin.gradle.host.Replugin'
        }
        hostGradleFqcn {
            id = 'com.qihoo360.replugin.replugin-host-gradle'
            implementationClass = 'com.qihoo360.replugin.gradle.host.Replugin'
        }
        hostGradleCentral {
            id = 'io.github.knifelfpro.replugin-host-gradle'
            implementationClass = 'com.qihoo360.replugin.gradle.host.Replugin'
        }
    }
}

project.ext.RP_ARTIFACT_ID = 'replugin-host-gradle'
apply from: '../rp-publish.gradle'
